<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e94a3f">
<title>出品文メーカー</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<style>
  :root{ --bg:#f6f6f7; --card:#fff; --ink:#1b1b1f; --sub:#6b6b76; --line:#e3e3e8; --accent:#e94a3f; --err:#c8362b; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141417; --card:#1e1e23; --ink:#f0f0f3; --sub:#a0a0ad; --line:#33333c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
    display:grid;place-items:center;min-height:100vh;padding:24px;font-size:16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;
    max-width:340px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  .logo{font-size:40px;line-height:1;margin-bottom:6px}
  h1{font-size:17px;margin:0 0 20px;font-weight:700}
  input{width:100%;padding:14px;font-size:20px;text-align:center;letter-spacing:.35em;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
    -webkit-appearance:none;appearance:none}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{width:100%;margin-top:12px;padding:15px;font-size:16px;font-weight:700;border:0;
    border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;font-size:13.5px;color:var(--err);min-height:20px;line-height:1.5}
  .sub{margin-top:16px;font-size:12px;color:var(--sub);line-height:1.6}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🔒</div>
    <h1>出品文メーカー</h1>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="パスワード" enterkeyhint="go">
    <button id="go">開く</button>
    <div class="msg" id="msg"></div>
    <div class="sub">このページは暗号化されています。<br>パスワードが合わないと開けません。</div>
  </div>

  var ITER = 1200000;
  var STORE = "mercari_pw";

  var $ = function(id){ return document.getElementById(id); };

  function b64ToBytes(b64){
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function unlock(pw){
    var raw = b64ToBytes(DATA);
    var salt = raw.slice(0,16), iv = raw.slice(16,28), body = raw.slice(28);
    var encoder = new TextEncoder();
    return crypto.subtle.importKey("raw", encoder.encode(pw), {name:"PBKDF2"}, false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256" },
          base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:"AES-GCM", iv:iv }, key, body);
      })
      .then(function(plain){
        return new TextDecoder().decode(plain);
      });
  }

  function show(html){
    document.open();
    document.write(html);
    document.close();
  }

  var busy = false;

  function tryOpen(pw, silent){
    if(busy) return;
    busy = true;
    $("go").disabled = true;
    $("msg").style.color = "";
    $("msg").textContent = "開いています…";
    unlock(pw).then(function(html){
      try{ localStorage.setItem(STORE, pw); }catch(e){}
      show(html);
    }).catch(function(){
      busy = false;
      $("go").disabled = false;
      if(silent){
        try{ localStorage.removeItem(STORE); }catch(e){}
        $("msg").textContent = "";
      } else {
        $("msg").textContent = "パスワードが違います";
        $("pw").value = "";
        $("pw").focus();
      }
    });
  }

  $("go").addEventListener("click", function(){
    var v = $("pw").value;
    if(!v){ $("msg").textContent = "パスワードを入れてください"; return; }
    tryOpen(v, false);
  });
  $("pw").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); $("go").click(); }
  });

  // 一度開いた端末は自動で開く
  var saved = null;
  try{ saved = localStorage.getItem(STORE); }catch(e){}
  if(saved){ tryOpen(saved, true); } else { $("pw").focus(); }
})();
